name: wf-cd-production
on :
   push: 
      branches:
        - production
jobs:
  build-artifacts-production:
    runs-on: ubuntu-latest
    steps:
      - name: checkout Repository
        uses: actions/checkout@v4
        with:
          ref: "${{github.ref}}"
      - name: Create Build build-artifacts with parcel
       run: npx parcel build "./src/index/html" --dist-dir "./dist" --public
      - name: upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifacts-production"
  deploy-artifacts-production:
    needs: "build-artifacts-production"
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: "pro0duction-env"  
    steps: 
      - name: Deploy Artifacts on GH pages
        uses: actions/deploy-pages@v4 
        with:
          artifact_name: "build-artifacts-production"
          token: "${{github.token}}"



          