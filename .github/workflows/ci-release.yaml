name: wf-ci-release
on:
  pull_request:
    branches:
      - release/**
    types:
      - opened
      - synchronize
jobs:
  linting-job-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: "${{github.ref}}"
      - name: Lint HTML Files With HTMLHint
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files With Stylelint
        run: npx stylelint "**/*.css" 
      - name: Test Building the Website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./rel-dist" --public-url "./"