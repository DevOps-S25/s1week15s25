name: wf-ci-release
on:
  pull_request:
    branches:
      - release/**
    types:
      - opened
      - synchronize
jobs:
  linting-job-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo on Runner
        uses: actions/checkout@v4
        with:
          ref: "${{github.ref}}"
      - name: Lint Html files with htmlhint
        run: npx htmlhint "**/*.html"
      - name: Lint css files with stylelint
        run: npx stylelint "**/*.css"
      - name: test building website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./rel-dist" --public-url "./"
          